## Robot settings for trajectory prediction
robot:
  type: "unicycle"
  unicycle:
    max_vel_x: 0.6
    max_vel_x_backwards: 0.3
    max_vel_theta: 0.5
    acc_lim_x: 0.5
    dec_lim_x: 0.5
    acc_lim_theta: 0.8

## Footprint model for collision avoidance
footprint_model:
  type: "point"

collision_avoidance:
  min_obstacle_dist: 0.3
  enable_dynamic_obstacles: True
  force_inclusion_dist: 0.4
  cutoff_dist: 3.0 
  collision_check_no_poses: 8

## Planning grid for trajectory prediction
grid:
  type: "fd_grid"
  grid_size_ref: 25
  dt_ref: 0.2
  xf_fixed: [True, True, False] # Allow final orientation to be free
  warm_start: True
  collocation_method: "forward_differences"
  cost_integration_method: "left_sum"
  variable_grid:
    enable: True  
    min_dt: 0.05
    max_dt: 2.0
    grid_adaptation:
      enable: True
      dt_hyst_ratio: 0.1
      min_grid_size: 5
      max_grid_size: 40

## Planning objective for trajectory prediction
planning:
  objective:
    type: "minimum_time"
    quadratic_form:
      state_weights: [1.0, 1.0, 1.0]
      control_weights: [0.5, 0.5]
      integral_form: False
      hybrid_cost_minimum_time: False
    minimum_time_via_points:
      position_weight: 5.0
      orientation_weight: 0.5
      via_points_ordered: False
  terminal_cost:
    type: "quadratic"
    quadratic:
      final_state_weights: [5.0, 5.0, 2.0]
  terminal_constraint:
    type: "none"

## Controller options for trajectory prediction
controller:
  outer_ocp_iterations: 1
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  force_reinit_new_goal_dist: 0.8
  force_reinit_new_goal_angular: 1.0
  force_reinit_num_steps: 0
  global_plan_overwrite_orientation: True
  global_plan_viapoint_sep: -1
  allow_init_with_backward_motion: True
  publish_ocp_results: True
  print_cpu_time: False
  
## Solver settings optimized for real-time trajectory prediction
solver:
  type: "ipopt"
  ipopt:
    iterations: 50
    max_cpu_time: 0.1  # Fast prediction for real-time performance
    ipopt_numeric_options:
      tol: 1e-3  # Relaxed tolerance for faster convergence
      dual_inf_tol: 1e-3
      constr_viol_tol: 1e-3
      compl_inf_tol: 1e-3
    ipopt_string_options:
      linear_solver: "mumps"
      hessian_approximation: "limited-memory"
      print_timing_statistics: "no"
      print_user_options: "no"
    ipopt_integer_options:
      print_level: 0  # Minimal output for cleaner logs
      max_iter: 50